name: spendanalyzer

services:
  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    volumes:
      - app-data:/data
    depends_on:
      - llm
    restart: unless-stopped

  llm:
    # Pinned by digest (was :latest) — this is exactly the image already on the
    # minipc (ollama 0.30.7), so deploys are reproducible and need no re-pull.
    image: ollama/ollama@sha256:46399ef084d97b381955b5dc585c5d836dbe7ed3f79f170d1c04660fed511e3a
    environment:
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-0}
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - api
    restart: unless-stopped

volumes:
  app-data:
  ollama-models:
