name: spendanalyzer

services:
  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    volumes:
      - app-data:/data
    depends_on:
      - llm
    restart: unless-stopped

  llm:
    image: ollama/ollama:latest
    environment:
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-0}
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - api
    restart: unless-stopped

volumes:
  app-data:
  ollama-models:
